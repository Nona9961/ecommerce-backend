server:
  port: 19891
spring:
  profiles:
    active: dev
  application:
    name: ecommerce-backend
  jpa:
    # OSV 必须关闭：session 打开时一次性定型租户模式，打开时机必须可控
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  config: classpath:log_config.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 认证安全链配置（无 profile 依赖：测试上下文不激活 dev，默认配置必须可独立构建）
nona:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-0123456789abcdef}
    jwt-ttl-seconds: 7200
    user-context-cache-ttl-seconds: 3600
  storage:
    root-dir: ${FILES_ROOT_DIR:./data/files}
    max-size-bytes: 10485760
    allowed-content-types: image/jpeg,image/png,image/webp,image/gif
