server:
  port: 19891
spring:
  profiles:
    active: dev
  application:
    name: ecommerce-backend
  jpa:
    # OSV 必须关闭：session 打开时一次性定型租户模式，打开时机必须可控
    open-in-view: false

logging:
  config: classpath:log_config.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
