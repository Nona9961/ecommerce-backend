spring:
  h2:
    console:
      enabled: true
      path: /h2
  datasource:
    url: jdbc:h2:mem:mydb
    username: root
    password: password
#    driver-class-name: com.mysql.cj.jdbc.Driver
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 300000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
  threads:
    virtual:
      enabled: true
  data:
    redis:
      # 本机 Redis 8（密码来自环境变量，未设置则直连无密）
      password: ${REDIS_PASSWORD:}
      timeout: 2s

nona:
  mock-gateway:
    # mock 支付渠道默认剧本（无标记单号走此剧本；SUCCESS/FAIL/NOCALLBACK）
    default-script: SUCCESS

change-tracking:
  identifier-methods:
    com.nona.domain.identity.entity.Address: getId
    com.nona.domain.catalog.entity.ShopCategory: getId
    com.nona.domain.catalog.entity.ProductImage: getId
    com.nona.domain.catalog.entity.ProductAttribute: getId
    com.nona.domain.catalog.entity.Sku: getId
    com.nona.domain.catalog.entity.ProductShopCategoryRef: id
