spring:
  datasource:
    # 开发面主库连接：密码零明文，占位符 ${ECOM_DB_PASSWORD} 由运行环境注入
    url: jdbc:mysql://127.0.0.1:13306/ecommerce?connectTimeout=5000&socketTimeout=8000&useSSL=false&allowPublicKeyRetrieval=true
    username: ecom_app
    password: ${ECOM_DB_PASSWORD}
    # driver 交由 Boot 从 URL 推导（与 test.yml 同形；显式声明会干扰测试内嵌 H2 override 面）
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 300000
      connection-test-query: SELECT 1
  flyway:
    # DDL 版本化：flyway-core + flyway-mysql（版本由 Boot BOM 管理）；默认启用，
    # 迁移脚本 classpath:db/migration。
    # baseline-on-migrate=true + baseline-version=0：库含自建探针表 cdc_probe
    # （永久存在、不入 V1），schema 永为非空，而不开 baseline 时 Flyway 拒绝迁移；
    # 基线化于版本 0 = 声明「V1 之前的库状态（仅探针表）不纳入 Flyway 管理」。
    # baseline-version 默认 1 会占用 V1 版本号导致 V1 被跳过，故显式归零。
    # 红线：Flyway clean 永久禁止——本库是 CDC（Debezium）源库，clean 清空业务表
    # 即炸整条 binlog 同步链路；任何脚本/命令不得执行 flyway clean 或手工
    # DROP / DROP DATABASE（清理一律走 scripts/test-db-reset.sh 数据级 DELETE）。
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    # 测试面 R 迁移（R__tenant_test_tables 仅 test locations）与 dev 共库：
    # test profile 应用后 history 含该记录，dev 启动校验报 missing（
    # 「Detected applied migration not resolved locally」）——忽略 repeatable
    # 类型的 missing（版本化 V 迁移仍严格校验，误删即拒启）。
    # 注意：本属性整体覆盖 Boot 默认值（*:future），故须显式保留 *:future——
    # 否则库中出现高于本地的 V 迁移时校验会拒绝启动。
    ignore-migration-patterns: repeatable:missing,*:future
  jpa:
    hibernate:
      # schema 校验：hbm2ddl 只验不建，schema 真源 = Flyway V1（24 表 PO 映射全集）。
      # validate 对全部注册 PO 校验表/列/可空/类型——注册新 PO 而迁移未落库时
      # 启动即失败 = 天然契约闸门
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
  threads:
    virtual:
      enabled: true
  data:
    redis:
      # Redis（密码来自环境变量，未设置则直连无密）
      password: ${REDIS_PASSWORD:}
      timeout: 2s

nona:
  mock-gateway:
    # mock 支付渠道默认剧本（无标记单号走此剧本；SUCCESS/FAIL/NOCALLBACK）
    default-script: SUCCESS
  scheduling:
    # 调度激活：推进器/超时引擎按真实节奏走（demo 验收面）
    enabled: true
  logistics:
    # 推进器扫描周期，javadoc 默认 5000ms
    scan-interval-ms: 5000

# replica 读库（顶层命名空间 replica.datasource.*）：开发面以 H2 内存库模拟
# product_search_view 跑服务层语义（ILIKE 兼容）；运行/生产形态指向 PG 读库，
# 由部署编排覆盖本段。注：本段经 Binder 绑定（url/username/password），
# 池参数用 Hikari 默认即可
replica:
  datasource:
    url: jdbc:h2:mem:replica;MODE=PostgreSQL
    username: sa
    password: ""

change-tracking:
  identifier-methods:
    com.nona.domain.identity.entity.Address: getId
    com.nona.domain.order.entity.CartItem: getId
    com.nona.domain.catalog.entity.ShopCategory: getId
    com.nona.domain.catalog.entity.ProductImage: getId
    com.nona.domain.catalog.entity.ProductAttribute: getId
    com.nona.domain.catalog.entity.Sku: getId
    com.nona.domain.catalog.entity.ProductShopCategoryRef: id
    com.nona.domain.payment.entity.PaymentCallbackRecord: getId
    com.nona.domain.payment.entity.RefundCallbackRecord: getId
    com.nona.domain.logistics.entity.WaybillTrack: getId